name: Check ENGRAM

on:
  push:
    branches: [main, 'codex/**']
    paths-ignore: ['**/*.md', 'assets/**', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    paths-ignore: ['**/*.md', 'assets/**', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:
    inputs:
      refresh_lockfile:
        description: Prepare a migration lockfile artifact; commit it before final verification.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: '2'

jobs:
  prepare:
    name: Resolve shared dependency lock
    runs-on: ubuntu-latest
    outputs:
      bootstrap: ${{ steps.lock.outputs.bootstrap }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Check committed lock or prepare migration lock
        id: lock
        env:
          REFRESH_LOCKFILE: ${{ inputs.refresh_lockfile || false }}
        shell: bash
        run: |
          bootstrap=false
          if [ "$REFRESH_LOCKFILE" = true ] || ! cargo metadata --locked --format-version 1 > /dev/null; then
            cargo generate-lockfile
            bootstrap=true
            echo '::warning::Commit the dependency-lockfile artifact before final locked-source verification.'
          fi
          echo "bootstrap=$bootstrap" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-lockfile
          path: Cargo.lock
          if-no-files-found: error

  frontend:
    name: React / TypeScript checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  verify:
    name: Rust and Tauri / ${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: dependency-lockfile
          path: .
      - uses: Swatinem/rust-cache@v2
        with:
          key: tauri-verify-${{ matrix.os }}
      - name: Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build embedded React frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - name: Check formatting
        id: formatting
        run: cargo fmt --all -- --check
      - name: Export formatting patch
        if: failure() && steps.formatting.outcome == 'failure' && runner.os == 'Linux'
        shell: bash
        run: |
          cargo fmt --all
          git diff --binary > formatting.patch
      - name: Upload formatting patch
        if: failure() && steps.formatting.outcome == 'failure' && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: formatting-patch
          path: formatting.patch
          if-no-files-found: error
      - name: Core and CLI tests
        if: success() || steps.formatting.outcome == 'failure'
        run: cargo test -p engram-core -p engram-cli --locked
      - name: Tauri command and session tests
        if: success() || steps.formatting.outcome == 'failure'
        run: cargo test -p engram-desktop --features engram-desktop/custom-protocol --locked
      - name: Clippy
        if: success() || steps.formatting.outcome == 'failure'
        run: cargo clippy --workspace --all-targets --features engram-desktop/custom-protocol --locked -- -D warnings

  native-preview:
    name: Native Tauri window and IPC / Linux
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: dependency-lockfile
          path: .
      - uses: Swatinem/rust-cache@v2
        with:
          key: tauri-native-preview-linux
      - name: Install WebKit and isolated display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb xdotool imagemagick x11-apps dbus-x11 fonts-dejavu-core libgl1-mesa-dri
      - name: Build embedded React frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - name: Build native Tauri application and CLI
        run: cargo build -p engram-desktop -p engram-cli --features engram-desktop/custom-protocol --locked
      - name: Generate a real-engine synthetic case
        run: |
          mkdir -p native-preview
          cargo run -p engram-cli --locked -- demo --out native-preview/demo-case.json
      - name: Verify frontend IPC and capture actual native windows
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          GDK_BACKEND: x11
        shell: bash
        run: |
          timeout 240s xvfb-run -a -s '-screen 0 1600x1100x24' dbus-run-session -- bash -euo pipefail <<'SMOKE'
          for view in map findings timeline connections; do
            name="$view"
            if [ "$view" = map ]; then name=workspace; fi
            log="native-preview/$name.log"
            target/debug/engram-desktop --demo --view "$view" --smoke-test > "$log" 2>&1 &
            app_pid=$!
            trap 'kill "$app_pid" 2>/dev/null || true' EXIT
            ready=false
            for attempt in $(seq 1 300); do
              if grep -q ENGRAM_TAURI_SMOKE_OK "$log"; then ready=true; break; fi
              if ! kill -0 "$app_pid" 2>/dev/null; then cat "$log"; wait "$app_pid"; exit 1; fi
              sleep 0.2
            done
            if [ "$ready" != true ]; then cat "$log"; exit 1; fi
            window_id=$(xdotool search --onlyvisible --name '^ENGRAM' | head -n 1)
            test -n "$window_id"
            import -window "$window_id" "native-preview/$name.png"
            test -s "native-preview/$name.png"
            wait "$app_pid"
            trap - EXIT
          done
          SMOKE
      - name: Upload native captures, IPC logs and fixture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-tauri-workspace-preview
          path: native-preview/
          if-no-files-found: error

  lockfile-committed:
    name: Committed lockfile gate
    if: always()
    needs: [prepare, frontend, verify, native-preview]
    runs-on: ubuntu-latest
    steps:
      - name: Require committed verified dependencies
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          NATIVE_RESULT: ${{ needs.native-preview.result }}
          BOOTSTRAP: ${{ needs.prepare.outputs.bootstrap }}
        run: |
          if [ "$BOOTSTRAP" = true ]; then
            echo '::error::Commit the dependency-lockfile artifact and rerun without refresh_lockfile. Bootstrap is not final locked-source verification.'
            exit 1
          fi
          for result in "$PREPARE_RESULT" "$FRONTEND_RESULT" "$VERIFY_RESULT" "$NATIVE_RESULT"; do
            test "$result" = success || exit 1
          done

