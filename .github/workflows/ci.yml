name: Check ENGRAM

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and native check / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: verify-${{ matrix.os }}
      - name: Bootstrap lockfile when the initial source has none
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile
      - name: Upload initial lockfile for review
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lockfile
          path: Cargo.lock
          if-no-files-found: error
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev libgtk-3-dev libdbus-1-dev
      - name: Check formatting
        id: formatting
        run: cargo fmt --all -- --check
      - name: Export a formatting patch for review
        if: failure() && steps.formatting.outcome == 'failure' && runner.os == 'Linux'
        shell: bash
        run: |
          cargo fmt --all
          git diff --binary > formatting.patch
      - name: Upload formatting patch
        if: failure() && steps.formatting.outcome == 'failure' && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: formatting-patch
          path: formatting.patch
          if-no-files-found: error
      - name: Core and CLI tests
        if: success() || steps.formatting.outcome == 'failure'
        run: cargo test -p engram-core -p engram-cli --locked
      - name: Native desktop check
        if: success() || steps.formatting.outcome == 'failure'
        run: cargo check -p engram-desktop --locked
      - name: Clippy
        if: success() || steps.formatting.outcome == 'failure'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  native-preview:
    name: Capture native desktop / Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-preview-linux
      - name: Bootstrap lockfile when the initial source has none
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile
      - name: Install desktop and headless display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev libgtk-3-dev libdbus-1-dev
      - name: Build the native application
        run: cargo build -p engram-desktop --locked
      - name: Render the real synthetic workspace
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WINIT_UNIX_BACKEND: x11
        run: |
          mkdir -p native-preview
          timeout 90s xvfb-run -a -s '-screen 0 1600x1100x24' target/debug/engram-desktop --demo --view map --screenshot native-preview/workspace.png --exit-after-screenshot
          test -s native-preview/workspace.png
      - name: Upload native screenshot
        uses: actions/upload-artifact@v4
        with:
          name: native-workspace-preview
          path: native-preview/workspace.png
          if-no-files-found: error

