name: Build ENGRAM app packages

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: '2'

jobs:
  build:
    name: Tauri app package / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            suffix: ''
          - os: windows-latest
            name: windows
            suffix: .exe
          - os: macos-15
            name: macos
            suffix: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          key: tauri-release-${{ matrix.os }}
      - name: Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Frontend tests and production assets
        working-directory: apps/desktop
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Verify core, CLI and desktop backend
        run: cargo test --workspace --features engram-desktop/custom-protocol --locked
      - name: Build CLI
        run: cargo build -p engram-cli --release --locked
      - name: Build Linux and Windows Tauri executable
        if: runner.os != 'macOS'
        working-directory: apps/desktop
        run: npm run tauri -- build --no-bundle --ci -- --locked
      - name: Build macOS application bundle
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: npm run tauri -- build --bundles app --ci -- --locked
      - name: Package and checksum
        shell: bash
        run: |
          platform="${{ matrix.name }}-$(rustc -vV | tr -d '\r' | sed -n 's/^host: //p')"
          version=$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))["workspace"]["package"]["version"])')
          folder="dist/engram-$platform"
          mkdir -p "$folder"
          cp "target/release/engram${{ matrix.suffix }}" "$folder/"
          if [ '${{ runner.os }}' = macOS ]; then
            cp -R target/release/bundle/macos/ENGRAM.app "$folder/"
          else
            cp "target/release/engram-desktop${{ matrix.suffix }}" "$folder/"
          fi
          cp README.md LICENSE "$folder/"
          printf '%s\n' "ENGRAM $version desktop app — Tauri + React" 'Offline analysis of explicitly selected files and backups.' 'Starts with a clearly labelled synthetic demonstration.' 'Unsigned packages; platform runtime requirements are listed below.' > "$folder/USAGE.txt"
          if [ '${{ runner.os }}' = Windows ]; then
            printf '%s\n' 'Run engram-desktop.exe. Microsoft Edge WebView2 Runtime is required.' 'This portable archive does not download or install the runtime.' >> "$folder/USAGE.txt"
          elif [ '${{ runner.os }}' = Linux ]; then
            printf '%s\n' 'Run ./engram-desktop. GTK 3 and WebKitGTK 4.1 runtime libraries must be installed.' >> "$folder/USAGE.txt"
          else
            printf '%s\n' 'Open ENGRAM.app. This build is unsigned and not notarized.' >> "$folder/USAGE.txt"
          fi
          export ENGRAM_PACKAGE_DIRECTORY="$folder"
          export ENGRAM_PACKAGE_ARCHIVE="dist/engram-$platform"
          export ENGRAM_PACKAGE_PLATFORM='${{ matrix.name }}'
          python - <<'PACKAGE'
          import hashlib, os, pathlib, tarfile, zipfile
          folder = pathlib.Path(os.environ['ENGRAM_PACKAGE_DIRECTORY'])
          files = sorted(path for path in folder.rglob('*') if path.is_file())
          lines = [f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(folder).as_posix()}" for path in files]
          (folder / 'SHA256SUMS.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          base = os.environ['ENGRAM_PACKAGE_ARCHIVE']
          if os.environ['ENGRAM_PACKAGE_PLATFORM'] == 'windows':
              archive = pathlib.Path(base + '.zip')
              with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as package:
                  for path in sorted(folder.rglob('*')):
                      if path.is_file():
                          package.write(path, path.relative_to(folder.parent))
          else:
              archive = pathlib.Path(base + '.tar.gz')
              with tarfile.open(archive, 'w:gz') as package:
                  package.add(folder, arcname=folder.name)
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          pathlib.Path(str(archive) + '.sha256').write_text(f'{digest}  {archive.name}\n', encoding='utf-8')
          PACKAGE
      - name: Upload native app packages
        uses: actions/upload-artifact@v4
        with:
          name: engram-${{ matrix.name }}-tauri-package
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

